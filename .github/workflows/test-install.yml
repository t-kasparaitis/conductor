name: test-install

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-macos:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The runner context is not available in job-level env, so stage the
      # isolated install home through GITHUB_ENV instead.
      - name: Isolate install home
        run: echo "CONDUCTOR_HOME=$RUNNER_TEMP/conductor-home" >> "$GITHUB_ENV"
      - name: Install links
        run: ./link.sh
      - name: Verify skills resolve through links
        run: |
          for skill in skills/*/; do
            name="$(basename "$skill")"
            for dir in "$CONDUCTOR_HOME/.claude/skills" "$CONDUCTOR_HOME/.agents/skills"; do
              grep -q "^name: $name" "$dir/$name/SKILL.md" || { echo "FAIL: $dir/$name"; exit 1; }
            done
          done
          echo "all links resolve"
      - name: Idempotent re-run
        run: ./link.sh
      - name: Existing real directory is not clobbered
        run: |
          ./link.sh --remove
          mkdir -p "$CONDUCTOR_HOME/.claude/skills/conductor-setup"
          touch "$CONDUCTOR_HOME/.claude/skills/conductor-setup/user-file.md"
          ./link.sh
          test -f "$CONDUCTOR_HOME/.claude/skills/conductor-setup/user-file.md"
          rm -rf "$CONDUCTOR_HOME/.claude/skills/conductor-setup"
      - name: Unrelated link is not clobbered or removed
        run: |
          ./link.sh --remove
          mkdir -p "$CONDUCTOR_HOME/foreign-skill"
          ln -s "$CONDUCTOR_HOME/foreign-skill" "$CONDUCTOR_HOME/.claude/skills/conductor-setup"
          ./link.sh
          test "$(readlink "$CONDUCTOR_HOME/.claude/skills/conductor-setup")" = "$CONDUCTOR_HOME/foreign-skill"
          ./link.sh --remove
          test -L "$CONDUCTOR_HOME/.claude/skills/conductor-setup"
          rm "$CONDUCTOR_HOME/.claude/skills/conductor-setup"
      - name: Remove
        run: |
          ./link.sh
          ./link.sh --remove
          test -z "$(find "$CONDUCTOR_HOME/.claude/skills" "$CONDUCTOR_HOME/.agents/skills" -type l 2>/dev/null)"
      - name: Rejects unknown arguments
        run: |
          if ./link.sh --rmeove 2>/dev/null; then echo "FAIL: unknown argument accepted"; exit 1; fi
          if ./link.sh --remove extra 2>/dev/null; then echo "FAIL: extra argument accepted"; exit 1; fi
          echo "unknown arguments rejected"
      - name: Fails loudly on empty skills directory
        run: |
          empty="$RUNNER_TEMP/empty-checkout"
          mkdir -p "$empty/skills"
          cp link.sh "$empty/"
          if CONDUCTOR_HOME="$RUNNER_TEMP/empty-home" "$empty/link.sh" 2>/dev/null; then
            echo "FAIL: empty skills directory accepted"; exit 1
          fi
          if [ -e "$RUNNER_TEMP/empty-home" ]; then
            echo "FAIL: created target dirs despite empty checkout"; exit 1
          fi
          echo "empty checkout rejected"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate install home
        shell: powershell
        run: |
          "CONDUCTOR_HOME=$env:RUNNER_TEMP\conductor-home" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install junctions
        shell: powershell
        run: .\link.ps1
      - name: Verify skills resolve through junctions
        shell: powershell
        run: |
          foreach ($skill in Get-ChildItem -Directory skills) {
            foreach ($dir in @("$env:CONDUCTOR_HOME\.claude\skills", "$env:CONDUCTOR_HOME\.agents\skills")) {
              $f = Join-Path $dir "$($skill.Name)\SKILL.md"
              if (-not (Select-String -Path $f -Pattern "^name: $($skill.Name)" -Quiet)) {
                Write-Error "FAIL: $f"; exit 1
              }
            }
          }
          Write-Host "all junctions resolve"
      - name: Idempotent re-run
        shell: powershell
        run: .\link.ps1
      - name: Existing real directory is not clobbered
        shell: powershell
        run: |
          .\link.ps1 -Remove
          New-Item -ItemType Directory -Force "$env:CONDUCTOR_HOME\.claude\skills\conductor-setup" | Out-Null
          New-Item -ItemType File "$env:CONDUCTOR_HOME\.claude\skills\conductor-setup\user-file.md" | Out-Null
          .\link.ps1
          if (-not (Test-Path "$env:CONDUCTOR_HOME\.claude\skills\conductor-setup\user-file.md")) { exit 1 }
          Remove-Item -Recurse -Force "$env:CONDUCTOR_HOME\.claude\skills\conductor-setup"
      - name: Unrelated junction is not clobbered or removed
        shell: powershell
        run: |
          .\link.ps1 -Remove
          $foreign = New-Item -ItemType Directory -Force "$env:CONDUCTOR_HOME\foreign-skill"
          $link = "$env:CONDUCTOR_HOME\.claude\skills\conductor-setup"
          New-Item -ItemType Junction -Path $link -Target $foreign.FullName | Out-Null
          .\link.ps1
          if ((Get-Item $link).Target -ne $foreign.FullName) { exit 1 }
          .\link.ps1 -Remove
          if (-not (Test-Path $link)) { exit 1 }
          (Get-Item $link).Delete()
      - name: Remove
        shell: powershell
        run: |
          .\link.ps1
          .\link.ps1 -Remove
          $links = Get-ChildItem "$env:CONDUCTOR_HOME\.claude\skills", "$env:CONDUCTOR_HOME\.agents\skills" -Recurse -Attributes ReparsePoint
          if ($links) { Write-Error "Managed junctions remain after removal"; exit 1 }
      - name: Rejects unknown arguments
        shell: powershell
        run: |
          $failed = $false
          try { .\link.ps1 -Rmeove } catch { $failed = $true }
          if (-not $failed) { Write-Error "unknown argument accepted"; exit 1 }
          Write-Host "unknown arguments rejected"
      - name: Fails loudly on empty skills directory
        shell: powershell
        run: |
          $empty = "$env:RUNNER_TEMP\empty-checkout"
          New-Item -ItemType Directory -Force "$empty\skills" | Out-Null
          Copy-Item link.ps1 $empty
          $env:CONDUCTOR_HOME = "$env:RUNNER_TEMP\empty-home"
          $failed = $false
          try { & "$empty\link.ps1" } catch { $failed = $true }
          if (-not $failed) { Write-Error "empty skills directory accepted"; exit 1 }
          if (Test-Path "$env:RUNNER_TEMP\empty-home") { Write-Error "created target dirs despite empty checkout"; exit 1 }
          Write-Host "empty checkout rejected"
