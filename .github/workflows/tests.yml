name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Unit, API and Chrome browser tests (Chrome is preinstalled on every runner).
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v

  # The same browser tests in Firefox, the second-choice browser.
  firefox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        env:
          CONDUCTOR_TEST_BROWSER: firefox
        run: python -m unittest discover -s tests -v
